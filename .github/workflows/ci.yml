name: Build and Deploy Pipeline

# Когда запускать: при каждом пуше в ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  # РАБОТА 1 (CI): Проверка кода в облаке GitHub
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: 2. Проверяем синтаксис docker-compose.yml
        run: |
          echo "Проверяем конфиг Compose..."
          docker compose -f docker-compose.yml config -q
          echo "Синтаксис в порядке!"

      - name: 3. Тестовая сборка Docker-образа
        run: |
          echo "Пробуем собрать образ..."
          docker build -t myapp:ci-test .
          echo "Образ успешно собрался!"

  # РАБОТА 2 (CD): Выкатка на твою Astra Linux
  deploy-to-astra:
    # Запускать ТОЛЬКО если первая работа прошла успешно!
    needs: check-and-build
    # Выполнять на твоем локальном раннере
    runs-on: self-hosted
    steps:
      - name: 1. Обновляем код на сервере
        run: |
          echo "Я выполняюсь на сервере: $(hostname) под пользователем: $(whoami)"
          cd /home/sa/docker-app
          git pull origin main

      - name: 2. Пересобираем и перезапускаем контейнеры
        run: |
          cd /home/sa/docker-app
          docker compose up -d --build
          docker image prune -f
          echo "Деплой успешно завершен!"

